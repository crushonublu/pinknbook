[package]
name = "app"
version = "0.5.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ADP core (ported from the proven Python spike)
rsa = { version = "0.9.6", features = ["pem", "sha2"] }
sha2 = "0.10.8"
base64 = "0.22.1"
rand = "0.8.5"
hex = "0.4.3"
chrono = "0.4.38"

# HTTP + parsing
reqwest = { version = "0.12.7", default-features = false, features = ["gzip", "rustls-tls", "json", "stream"] }
roxmltree = "0.20.0"
url = "2.5.2"

# Local storage + secrets
rusqlite = { version = "0.32.1", features = ["bundled"] }
keyring = { version = "3.2.1", features = ["windows-native"] }

# Errors
thiserror = "1.0.63"

# Library metadata: cover decoding (spine colour) and download pacing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
tokio = { version = "1", features = ["time", "sync"] }
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
flate2 = "1"
tauri-plugin-dialog = "2"
# Reads the content:// URIs Android's file picker returns.
tauri-plugin-fs = "2"

[dev-dependencies]
# For the ignored, read-only live library-pull test.
tokio = { version = "1.40", features = ["rt"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Windows' own TLS stack: the fallback when Google Translate rate-limits the
# rustls client (it needs OpenSSL elsewhere, e.g. on Android).
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12.7", default-features = false, features = ["native-tls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
